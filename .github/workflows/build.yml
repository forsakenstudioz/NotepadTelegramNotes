name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 zip
      - name: Build 64-bit DLL
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramNotes-x64
          path: dist/TelegramNotes
      - name: Attach to release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TelegramNotes-x64.zip
